<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumia Ai</title>
<style>
:root{--bg:#fff;--sf:#f4f4f5;--sd:#f9f9fa;--tx:#202123;--mu:#6e6e80;--bd:#e5e5e8;--ac:#10a37f;--code:#f4f4f5;--ub:#ececf1}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--sf:#2f2f2f;--sd:#171717;--tx:#ececec;--mu:#9b9b9b;--bd:#3a3a3a;--ac:#19c37d;--code:#171717;--ub:#2f2f2f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac);word-break:break-all}
.side{width:260px;background:var(--sd);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0}
#new{border:1px solid var(--bd);background:none;padding:10px 12px;border-radius:12px;text-align:left;font-weight:600}
#new:hover,.it:hover{background:var(--sf)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:10px}
.it.on{background:var(--sf)}
.it .t{flex:1;text-align:left;border:0;background:none;padding:9px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px}
.it .x{border:0;background:none;color:var(--mu);padding:6px 10px}
#set{border:0;background:none;padding:10px;border-radius:10px;text-align:left}
#set:hover{background:var(--sf)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#menu{display:none;border:0;background:none;font-size:20px;padding:4px 8px}
.sw{display:flex;background:var(--sf);border-radius:12px;padding:3px}
.sw button{border:0;background:none;color:var(--mu);font-size:14px;font-weight:600;padding:6px 14px;border-radius:9px}
.sw button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#chip{margin-left:auto;border:0;background:var(--sf);border-radius:14px;padding:5px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#chip i{width:10px;height:10px;border-radius:50%;background:#22c55e}
#lite{display:none;margin:0 12px;padding:8px 12px;border-radius:12px;background:var(--sf);font-size:14px;color:var(--mu);align-items:center;gap:8px}
#lite.show{display:flex}
#lite span{flex:1}
#lite button{border:0;background:none;font-size:16px;color:var(--mu)}
#msgs{flex:1;overflow-y:auto;padding:12px;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{overflow-wrap:anywhere;white-space:pre-wrap}
.u{align-self:flex-end;max-width:85%;background:var(--ub);padding:8px 16px;border-radius:20px}
.a{align-self:stretch}
.tag{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:2px}
code{background:var(--code);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,Consolas,monospace}
.cb{margin:10px 0;background:var(--code);border-radius:12px;overflow:hidden;white-space:normal}
.cb button{display:block;margin:6px 8px 0 auto;border:0;background:none;color:var(--mu);font-size:12px}
.cb pre{margin:0;padding:6px 14px 14px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.empty{margin:auto;text-align:center;color:var(--mu)}
.empty b{display:block;font-size:30px;color:var(--tx);margin-bottom:4px}
.foot{width:100%;max-width:760px;margin:0 auto;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#limit{display:none;margin-bottom:8px;padding:9px 14px;border-radius:12px;background:var(--sf);font-size:14px}
#limit.show{display:block}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--sf);border-radius:26px;padding:8px 8px 8px 18px}
textarea{flex:1;resize:none;max-height:150px;border:0;background:none;color:var(--tx);padding:8px 0;font:inherit;outline:none}
#go{border:0;background:var(--tx);color:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;flex-shrink:0}
#go:disabled{opacity:.3}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.card{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:380px}
.card h2{margin:0 0 14px;font-size:18px}
.row{margin:12px 0}
.pb{height:10px;background:var(--sf);border-radius:5px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:#22c55e;transition:width .3s,background .3s}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg input{width:20px;height:20px}
.small{font-size:13px;color:var(--mu)}
#close{margin-top:10px;width:100%;border:0;background:var(--tx);color:var(--bg);padding:10px;border-radius:12px;font-weight:600}
@media(max-width:760px){
.side{position:fixed;z-index:10;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
#menu{display:block}}
</style>
</head>
<body>
<aside class="side" id="side">
  <button id="new" type="button">＋ Новый чат</button>
  <div id="list"></div>
  <button id="set" type="button">⚙ Настройки</button>
</aside>
<div class="main">
  <header>
    <button id="menu" type="button">☰</button>
    <div class="sw">
      <button id="b-deep" class="on" type="button">Deep 1</button>
      <button id="b-heroes" type="button">Heroes 1</button>
    </div>
    <button id="chip" type="button"><i></i><span>100%</span></button>
  </header>
  <div id="lite"><span>Осталось меньше 30%: Deep 1 работает на облегчённой модели. Запрос стоит 3% вместо 6%.</span><button id="lx" type="button">✕</button></div>
  <div id="msgs"></div>
  <div class="foot">
    <div id="limit"></div>
    <div class="bar">
      <textarea id="in" rows="1" placeholder="Напиши, что нужно…"></textarea>
      <button id="go" type="button">↑</button>
    </div>
  </div>
</div>
<div class="ov" id="ov"><div class="card">
  <h2>Настройки</h2>
  <div class="row"><div class="tg"><b id="pct">100%</b><span class="small" id="rst"></span></div><div class="pb"><i id="bar"></i></div>
    <div class="small" style="margin-top:6px">Остаток запросов на сегодня. Heroes 1 — 4%, Deep 1 — 6% (на облегчённой модели 3%).</div></div>
  <div class="row tg"><span>Помнить прошлые чаты</span><input type="checkbox" id="mem"></div>
  <button id="close" type="button">Готово</button>
</div></div>
<script>
const KEY = "lumia_chats_v1", MK = "lumia_model", PK = "lumia_mem";
const NAMES = {deep: "Deep 1", heroes: "Heroes 1"};
const $ = id => document.getElementById(id);
let chats = [], cid = null, cur = "deep", busy = false, memOn = true, liteHidden = false;
let srv = {left: 100, resetAt: 0}, did = "";
try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); cur = localStorage.getItem(MK) || "deep"; memOn = localStorage.getItem(PK) !== "0"; did = localStorage.getItem("lumia_did") || ""; } catch (e) {}
if (!did){
  did = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2) + "0000000000";
  try { localStorage.setItem("lumia_did", did); } catch (e) {}
}
if (!NAMES[cur]) cur = "deep";
if (chats.length) cid = chats[0].id;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 50))); } catch (e) {} };
const chat = () => chats.find(c => c.id === cid);

const left = () => srv.left;
const light = () => cur === "deep" && srv.left > 0 && srv.left < 30;
const hhmm = t => new Date(t).toLocaleTimeString("ru", {hour: "2-digit", minute: "2-digit"});
const color = l => l >= 70 ? "#22c55e" : l >= 30 ? "#eab308" : "#ef4444";

function refresh(){
  const l = left(), col = color(l);
  $("lite").classList.toggle("show", light() && !liteHidden);
  const out = l <= 0;
  $("limit").classList.toggle("show", out);
  if(out) $("limit").textContent = "Лимит закончился, попробуйте позже. Всё обновится в " + hhmm(srv.resetAt) + ".";
  $("go").disabled = busy || out;
  $("pct").textContent = l + "%";
  $("pct").style.color = col;
  $("bar").style.width = l + "%";
  $("bar").style.background = col;
  $("chip").firstChild.style.background = col;
  $("chip").lastChild.textContent = l + "%";
  $("rst").textContent = srv.resetAt ? "Обновится в " + hhmm(srv.resetAt) : "Сутки начнутся с первого запроса";
}
async function loadUsage(){
  try{
    const r = await fetch("/api/usage", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({did})});
    const d = await r.json();
    if(r.ok){ srv = {left: d.left, resetAt: d.resetAt}; refresh(); }
  }catch(e){}
}
function setModel(k){
  cur = k;
  try { localStorage.setItem(MK, k); } catch (e) {}
  $("b-deep").classList.toggle("on", k === "deep");
  $("b-heroes").classList.toggle("on", k === "heroes");
  refresh();
}
const openSet = () => { $("mem").checked = memOn; loadUsage(); refresh(); $("ov").classList.add("show"); };
$("b-deep").onclick = () => setModel("deep");
$("b-heroes").onclick = () => setModel("heroes");
$("lx").onclick = () => { liteHidden = true; refresh(); };
$("set").onclick = openSet;
$("chip").onclick = openSet;
$("close").onclick = () => $("ov").classList.remove("show");
$("mem").onchange = e => { memOn = e.target.checked; try { localStorage.setItem(PK, memOn ? "1" : "0"); } catch (x) {} };

function link(href, text){
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function inl(p, t){
  t.split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<>"]+)/).forEach(s => {
    if(!s) return;
    let n, m;
    if(s[0] === "`" && s.length > 2){ n = document.createElement("code"); n.textContent = s.slice(1, -1); }
    else if(s.startsWith("**") && s.length > 4){ n = document.createElement("b"); n.textContent = s.slice(2, -2); }
    else if((m = s.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/))){ n = link(m[2], m[1]); }
    else if(/^https?:\/\//.test(s)){ n = link(s, s); }
    else n = document.createTextNode(s);
    p.append(n);
  });
}
function fill(el, text){
  el.textContent = "";
  text.split("```").forEach((part, i) => {
    if(i % 2){
      const code = part.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
      const box = document.createElement("div"); box.className = "cb";
      const btn = document.createElement("button"); btn.textContent = "Копировать"; btn.type = "button";
      btn.onclick = () => { try { navigator.clipboard.writeText(code); btn.textContent = "Скопировано"; setTimeout(() => btn.textContent = "Копировать", 1500); } catch (e) {} };
      const pre = document.createElement("pre"); pre.textContent = code;
      box.append(btn, pre); el.append(box);
    } else if(part) inl(el, part);
  });
}
function bubble(role, text, tag){
  const el = document.createElement("div");
  el.className = "m " + (role === "user" ? "u" : "a");
  if(tag){ const t = document.createElement("span"); t.className = "tag"; t.textContent = tag; el.append(t); }
  const body = document.createElement("div"); fill(body, text); el.append(body);
  $("msgs").append(el);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return body;
}
function renderList(){
  const l = $("list"); l.textContent = "";
  chats.forEach(c => {
    const row = document.createElement("div"); row.className = "it" + (c.id === cid ? " on" : "");
    const t = document.createElement("button"); t.className = "t"; t.type = "button"; t.textContent = c.title;
    t.onclick = () => { cid = c.id; renderAll(); $("side").classList.remove("open"); };
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "✕";
    x.onclick = () => { chats = chats.filter(k => k.id !== c.id); if(cid === c.id) cid = chats[0] ? chats[0].id : null; save(); renderAll(); };
    row.append(t, x); l.append(row);
  });
}
function renderMsgs(){
  const m = $("msgs"); m.textContent = "";
  const c = chat();
  if(!c || !c.msgs.length){
    const d = document.createElement("div"); d.className = "empty";
    const b = document.createElement("b"); b.textContent = "Lumia Ai";
    d.append(b, "Чем могу помочь?"); m.append(d); return;
  }
  c.msgs.forEach(x => bubble(x.role, x.content, x.role === "assistant" ? x.model : null));
}
function renderAll(){ renderList(); renderMsgs(); refresh(); }
$("new").onclick = () => { cid = null; renderAll(); $("side").classList.remove("open"); $("in").focus(); };
$("menu").onclick = () => $("side").classList.toggle("open");

function memory(){
  if(!memOn) return "";
  return chats.filter(c => c.id !== cid).slice(0, 6).map(c => {
    const q = c.msgs.filter(m => m.role === "user").slice(-1)[0];
    return "- " + c.title + (q ? ": " + q.content.slice(0, 80) : "");
  }).join("\n");
}
async function ask(model, msgs){
  const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({did, model, memory: memory(), messages: msgs.map(({role, content}) => ({role, content}))})});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw {code: r.status, data: d};
  return d;
}
async function send(){
  const text = $("in").value.trim();
  if(!text || busy || left() <= 0) return;
  busy = true; $("go").disabled = true; $("in").value = ""; $("in").style.height = "auto";
  let c = chat();
  if(!c){ c = {id: String(Date.now()), title: text.slice(0, 32), msgs: []}; chats.unshift(c); cid = c.id; }
  c.msgs.push({role: "user", content: text}); save(); renderAll();
  const body = bubble("assistant", "Думаю…", NAMES[cur] + (light() ? " (облегчённый)" : ""));
  try{
    const d = await ask(cur, c.msgs);
    c.msgs.push({role: "assistant", content: d.text, model: NAMES[cur] + (d.light ? " (облегчённый)" : "")}); save();
    srv = {left: d.left, resetAt: d.resetAt};
    fill(body, d.text);
  }catch(e){
    c.msgs.pop(); save();
    if(e && e.data && e.data.limit){ srv = {left: 0, resetAt: e.data.resetAt}; renderAll(); $("in").value = text; }
    else fill(body, e && e.code === 429 ? "Слишком много запросов, подожди немного." : "Не получилось ответить. Попробуй ещё раз.");
  }
  busy = false; refresh(); $("in").focus();
}
$("go").onclick = send;
$("in").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && innerWidth > 760){ e.preventDefault(); send(); } });
$("in").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px"; });
window.addEventListener("focus", loadUsage);
setModel(cur);
renderAll();
loadUsage();
</script>
</body>
</html>
