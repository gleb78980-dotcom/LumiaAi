<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumia Ai</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--sf:#f0eee6;--sd:#f5f4ed;--tx:#1f1e1d;--mu:#73726c;--bd:#e5e2d8;--ac:#d97757;--code:#f0eee6;--ub:#efece3}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--sf:#3a3937;--sd:#1f1e1d;--tx:#faf9f5;--mu:#a6a39a;--bd:#43423e;--ac:#d97757;--code:#1f1e1d;--ub:#30302e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
a{color:var(--ac);word-break:break-all}
.ico{display:inline-flex}
.side{width:260px;background:var(--sd);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-family:Georgia,"Times New Roman",serif;font-size:19px;padding:4px 6px 8px}
.brand svg{width:28px;height:28px}
#new,#set{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left}
#new{font-weight:600}
#new:hover,.it:hover,#set:hover{background:var(--sf)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:10px}
.it.on{background:var(--sf)}
.it .t{flex:1;text-align:left;border:0;background:none;padding:9px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px}
.it .x{border:0;background:none;color:var(--mu);padding:8px 10px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#menu{display:none;border:0;background:none;padding:6px;border-radius:8px;color:var(--mu)}
.sw{display:flex;background:var(--sf);border-radius:12px;padding:3px}
.sw button{border:0;background:none;color:var(--mu);font-size:14px;font-weight:600;padding:6px 14px;border-radius:9px}
.sw button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#mh{padding:0 14px 6px;font-size:13px;color:var(--mu)}
#chip{margin-left:auto;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:5px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#chip i{width:10px;height:10px;border-radius:50%;background:#22c55e}
.nc{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.nc .ni{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(217,119,87,.14);color:var(--ac);display:flex;align-items:center;justify-content:center}
.nc .nt{flex:1;padding-top:2px;white-space:normal}
.a .nc{margin-top:8px}
#lite{display:none;margin:0 12px 6px}
#lite.show{display:flex}
#lite .nt{color:var(--mu)}
#lite button{border:0;background:none;color:var(--mu);padding:2px}
#limit{display:none;margin-bottom:8px}
#limit.show{display:flex}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:min(440px,92%);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
#msgs{flex:1;overflow-y:auto;padding:12px;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{overflow-wrap:anywhere;white-space:pre-wrap}
.u{align-self:flex-end;max-width:85%;background:var(--ub);padding:8px 16px;border-radius:18px}
.a{align-self:stretch}
.tag{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:2px}
code{background:var(--code);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,Consolas,monospace}
.cb{margin:10px 0;background:var(--code);border-radius:12px;overflow:hidden;white-space:normal}
.cb button{display:block;margin:6px 8px 0 auto;border:0;background:none;color:var(--mu);padding:4px}
.cb pre{margin:0;padding:6px 14px 14px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.gen{position:relative;width:min(360px,100%);aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--sf);border:1px solid var(--bd);box-shadow:0 0 0 1px rgba(217,119,87,.28),0 10px 34px rgba(217,119,87,.2);white-space:normal}
.gen::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0,rgba(217,119,87,.45) 20%,rgba(108,92,231,.38) 45%,transparent 65%);filter:blur(34px);animation:spin 3.2s linear infinite}
.gen::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);background-size:220% 100%;animation:shine 1.7s linear infinite}
.gen span{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;color:var(--tx);opacity:.75;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{from{background-position:220% 0}to{background-position:-220% 0}}
.gimg{display:block;width:min(420px,100%);border-radius:20px;animation:fi .6s ease}
@keyframes fi{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.dl{display:inline-flex;align-items:center;margin-top:8px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;padding:6px 10px}
.empty{margin:auto;text-align:center;color:var(--mu)}
.empty svg{width:76px;height:76px;margin:0 auto 10px}
.empty b{display:block;font:500 32px Georgia,"Times New Roman",serif;color:var(--tx);margin-bottom:4px}
.foot{position:relative;width:100%;max-width:760px;margin:0 auto;padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.disc{text-align:center;font-size:12px;color:var(--mu);margin-top:8px}
#att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#att:empty{display:none}
.ch{position:relative;background:var(--sf);border-radius:12px;font-size:13px;padding:6px 28px 6px 10px;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch.p{padding:0;width:56px;height:56px}
.ch img{width:56px;height:56px;object-fit:cover;display:block;border-radius:12px}
.ch.v::after{content:"";position:absolute;left:50%;top:50%;margin:-8px 0 0 -5px;border-left:14px solid rgba(255,255,255,.92);border-top:8px solid transparent;border-bottom:8px solid transparent}
.ch button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:18px;height:18px;padding:0;display:flex;align-items:center;justify-content:center;z-index:1}
.bar{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px 10px 8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{width:100%;resize:none;max-height:150px;min-height:30px;border:0;background:none;color:var(--tx);padding:4px 2px;font:inherit;outline:none}
.row2{display:flex;align-items:center;gap:4px;margin-top:4px}
.sp{flex:1}
#plus,#mic{border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--mu);display:flex;align-items:center;justify-content:center}
#plus:hover,#mic:hover{background:var(--sf);color:var(--tx)}
#mic.on{color:#fff;background:#dc2626}
#go{border:0;background:var(--ac);color:#fff;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
#go:disabled{opacity:.35}
#pm{display:none;position:absolute;left:12px;bottom:calc(122px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5}
#pm button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 16px;border-radius:10px;white-space:nowrap}
#pm button:hover{background:var(--sf)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.card{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.card h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.row{margin:12px 0}
.pb{height:10px;background:var(--sf);border-radius:5px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:#22c55e;transition:width .3s,background .3s}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg input{width:20px;height:20px;accent-color:var(--ac)}
.small{font-size:13px;color:var(--mu)}
#lsel{background:var(--sf);border:0;border-radius:10px;padding:8px 10px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg button{padding:11px;border:1px solid var(--bd);background:var(--card);border-radius:12px}
#close{margin-top:10px;width:100%;border:0;background:var(--tx);color:var(--bg);padding:10px;border-radius:12px;font-weight:600}
@media(max-width:760px){
.side{position:fixed;z-index:10;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
#menu{display:block}}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><span id="blogo"></span>Lumia Ai</div>
  <button id="new" type="button"><span class="ico" data-ic="pen"></span><span data-i="0"></span></button>
  <div id="list"></div>
  <button id="set" type="button"><span class="ico" data-ic="sliders"></span><span data-i="1"></span></button>
</aside>
<div class="main">
  <header>
    <button id="menu" type="button" data-ic="menu"></button>
    <div class="sw">
      <button id="b-deep" class="on" type="button">Deep 1</button>
      <button id="b-heroes" type="button">Heroes 1</button>
    </div>
    <button id="chip" type="button"><i></i><span>100%</span></button>
  </header>
  <div id="mh"></div>
  <div id="lite" class="nc"><span class="ni" data-ic="info" data-s="15"></span><span class="nt" data-i="4"></span><button id="lx" type="button" data-ic="x" data-s="16"></button></div>
  <div id="msgs"></div>
  <div class="foot">
    <div id="limit" class="nc"></div>
    <div id="att"></div>
    <div id="pm">
      <button id="pp" type="button"></button>
      <button id="pf" type="button"></button>
      <button id="pi" type="button"></button>
      <button id="pd" type="button"></button>
    </div>
    <div class="bar">
      <textarea id="in" rows="1"></textarea>
      <div class="row2">
        <button id="plus" type="button" data-ic="plus"></button>
        <span class="sp"></span>
        <button id="mic" type="button" data-ic="mic"></button>
        <button id="go" type="button" data-ic="up"></button>
      </div>
    </div>
    <div class="disc" data-i="33"></div>
    <input type="file" id="fi" accept="image/*,video/*" multiple hidden>
    <input type="file" id="ff" multiple hidden accept=".txt,.md,.csv,.json,.html,.css,.js,.ts,.py,.java,.c,.cpp,.cs,.go,.rs,.php,.rb,.sql,.xml,.yml,.yaml,.log,.ini,.sh,.pdf,.mp3,.wav,.m4a,.aac,.ogg,.flac,.obj,.stl,.glb,.gltf,.ply,text/*,audio/*,application/pdf">
  </div>
</div>
<div id="toast" class="nc"></div>
<div class="ov" id="ov"><div class="card">
  <h2 data-i="1"></h2>
  <div class="row"><div class="tg"><b id="pct">100%</b><span class="small" id="rst"></span></div><div class="pb"><i id="bar"></i></div>
    <div class="small" style="margin-top:6px"><span data-i="6"></span> · Heroes 1 — 4% (2%) · Deep 1 — 6% (3%) · <span data-i="30"></span> ×1.5</div></div>
  <div class="row"><div class="tg"><b id="cpct">600 / 600</b><span class="small" id="crst"></span></div><div class="pb"><i id="cbar"></i></div>
    <div class="small" style="margin-top:6px"><span data-i="20"></span><br><span data-i="21"></span></div></div>
  <div class="row tg"><span data-i="8"></span><input type="checkbox" id="mem"></div>
  <div class="row tg"><span class="ico" data-ic="globe"></span><select id="lsel"></select></div>
  <button id="close" type="button" data-i="9"></button>
</div></div>
<div class="ov" id="lov"><div class="card">
  <h2><span class="ico" data-ic="globe"></span>Language</h2>
  <div class="lg" id="lg"></div>
</div></div>
<script>
const KEY = "lumia_chats_v1", MK = "lumia_model", PK = "lumia_mem", LK = "lumia_lang";
const NAMES = {deep: "Deep 1", heroes: "Heroes 1"};
const LANGS = [["ru","Русский"],["en","English"],["uk","Українська"],["es","Español"],["de","Deutsch"],["fr","Français"],["it","Italiano"],["pt","Português"],["pl","Polski"],["tr","Türkçe"],["zh","中文"],["ja","日本語"],["ko","한국어"],["hi","हिन्दी"],["th","ไทย"]];

const IC = {
plus:'<path d="M12 5v14M5 12h14"/>',

};
const ic = (n, s) => '<svg viewBox="0 0 24 24" width="' + (s || 20) + '" height="' + (s || 20) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + IC[n] + '</svg>';

// 30 погружение глубже, 31 заметка про режим, 32 переключение на FLUX 1, 33 «Lumia — ИИ, он может ошибаться»

function shrink(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 896 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .8));
      };
      im.onerror = () => res(null);
      im.src = r.result;
    };
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });
}
const b64 = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => res(""); r.readAsDataURL(f); });
function frames(file, n){
  return new Promise(res => {
    const v = document.createElement("video"), url = URL.createObjectURL(file), out = [];
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    const done = () => { URL.revokeObjectURL(url); res(out); };
    v.onerror = done;
    v.onloadedmetadata = async () => {
      const d = v.duration || 1, w = v.videoWidth || 640, h = v.videoHeight || 360, k = Math.min(1, 640 / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const g = c.getContext("2d");
      for(let i = 0; i < n; i++){
        await new Promise(r => { v.onseeked = r; setTimeout(r, 2000); v.currentTime = Math.max(0, Math.min(d - 0.05, d * (i + 0.5) / n)); });
        try { g.drawImage(v, 0, 0, c.width, c.height); out.push(c.toDataURL("image/jpeg", .7)); } catch (e) {}
      }
      done();
    };
  });
}
async function info3d(f){
  const ext = f.name.split(".").pop().toLowerCase(), buf = await f.arrayBuffer(), dv = new DataView(buf), dec = new TextDecoder();
  const hd = "3D model summary (extracted from file " + f.name + ", " + (f.size / 1e6).toFixed(1) + " MB; not an image): ";
  const bb = (mn, mx) => " bounding box " + [0, 1, 2].map(i => mn[i].toFixed(2) + ".." + mx[i].toFixed(2)).join(" x ");
  if(ext === "obj"){
    let v = 0, fc = 0, vt = 0, vn = 0; const o = [], mt = [], mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
    for(const l of dec.decode(buf).split("\n")){
      if(l[0] === "v" && l[1] === " "){ v++; const p = l.trim().split(/\s+/); for(let i = 0; i < 3; i++){ const x = +p[i + 1]; if(x < mn[i]) mn[i] = x; if(x > mx[i]) mx[i] = x; } }
      else if(l.startsWith("vt ")) vt++; else if(l.startsWith("vn ")) vn++;
      else if(l[0] === "f" && l[1] === " ") fc++;
      else if(/^[og] /.test(l)) { if(o.length < 25) o.push(l.slice(2).trim()); }
      else if(l.startsWith("usemtl ")){ const m = l.slice(7).trim(); if(mt.length < 15 && !mt.includes(m)) mt.push(m); }
    }
    return hd + "OBJ, " + v + " vertices, " + fc + " faces, " + vt + " UV, " + vn + " normals; objects/groups: " + (o.join(", ") || "-") + "; materials: " + (mt.join(", ") || "-") + ";" + (v ? bb(mn, mx) : "");
  }
  if(ext === "stl"){
    const n = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
    if(buf.byteLength === 84 + 50 * n){
      const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
      for(let i = 0; i < n; i++) for(let j = 0; j < 9; j++){ const x = dv.getFloat32(84 + i * 50 + 12 + j * 4, true), a = j % 3; if(x < mn[a]) mn[a] = x; if(x > mx[a]) mx[a] = x; }
      return hd + "binary STL, " + n + " triangles;" + (n ? bb(mn, mx) : "");
    }
    return hd + "ASCII STL, " + (dec.decode(buf).match(/facet normal/g) || []).length + " triangles.";
  }
  if(ext === "ply"){
    const s = dec.decode(new Uint8Array(buf, 0, Math.min(4000, buf.byteLength))), e = s.indexOf("end_header");
    return hd + "PLY header: " + s.slice(0, e > 0 ? e : 800).replace(/\r?\n/g, "; ");
  }
  let j = null;
  try {
    if(ext === "glb" && dv.getUint32(0, true) === 0x46546C67) j = JSON.parse(dec.decode(new Uint8Array(buf, 20, dv.getUint32(12, true))));
    else if(ext === "gltf") j = JSON.parse(dec.decode(buf));
  } catch (e) {}
  if(!j) return null;
  const nm = a => (a || []).slice(0, 12).map(x => x.name || "?").join(", ") || "-", ct = a => (a || []).length;
  return hd + ext.toUpperCase() + ", meshes " + ct(j.meshes) + " (" + nm(j.meshes) + "), materials " + ct(j.materials) + " (" + nm(j.materials) + "), nodes " + ct(j.nodes) + ", textures " + ct(j.textures) + ", images " + ct(j.images) + ", animations " + ct(j.animations) + " (" + nm(j.animations) + "), skins " + ct(j.skins) + ", generator: " + ((j.asset && j.asset.generator) || "-") + ".";
}

  e.target.value = ""; renderAtt(); refresh();
};
const AUD = /\.(mp3|wav|m4a|aac|ogg|flac)$/i, D3 = /\.(obj|stl|glb|gltf|ply)$/i;
const AM = {mp3: "audio/mpeg", wav: "audio/wav", m4a: "audio/aac", aac: "audio/aac", ogg: "audio/ogg", flac: "audio/flac"};
$("ff").onchange = async e => {
  const hint = t(13) + ": txt · md · csv · json · code · pdf · mp3 · wav · m4a · aac · ogg · flac · obj · stl · glb · gltf · ply";
  for(const f of e.target.files){
    if(docs.length + bins.length >= 3){ note(t(13) + " ≤ 3"); break; }
    const ext = f.name.split(".").pop().toLowerCase();
    if(D3.test(f.name)){
      if(f.size > 10e6){ note(t(13) + " ≤ 10 MB"); continue; }
      let s = null; try { s = await info3d(f); } catch (x) {}
      if(!s){ note(hint, "alert"); continue; }
      docs.push({name: f.name, text: s.slice(0, 4000)}); renderAtt(); continue;
    }
    if(AUD.test(f.name) || ext === "pdf"){
      if(f.size > 10e6){ note(t(13) + " ≤ 10 MB"); continue; }
      if(rawSize() + f.size > 12e6){ note("≤ 12 MB"); continue; }
      const data = await b64(f); if(!data) continue;
      bins.push({name: f.name, mime: ext === "pdf" ? "application/pdf" : AM[ext], data, size: f.size}); renderAtt(); refresh(); continue;
    }
    if(f.size > 2e6){ note(t(13) + " ≤ 2 MB"); continue; }
    if(/\.(docx?|xlsx?|pptx?|zip|rar|7z|png|jpe?g|gif|webp|exe|apk|mp4|webm)$/i.test(f.name)){ note(hint, "alert"); continue; }
    let txt = ""; try { txt = await f.text(); } catch (x) {}
    if(!txt || txt.indexOf("\u0000") >= 0){ note(hint, "alert"); continue; }
    docs.push({name: f.name, text: txt.slice(0, 4000)});
  }
  e.target.value = ""; renderAtt(); refresh();
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if(!SR){ note(t(14), "alert"); return; }
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = RL[lang] || "ru-RU"; rec.interimResults = true; rec.continuous = true;
  const base = $("in").value ? $("in").value + " " : "";
  rec.onresult = e => {
    let s = ""; for(let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
    $("in").value = base + s; $("in").dispatchEvent(new Event("input"));
  };
  rec.onend = () => { rec = null; $("mic").classList.remove("on"); $("mic").innerHTML = ic("mic"); };
  rec.onerror = () => {};
  try { rec.start(); $("mic").classList.add("on"); $("mic").innerHTML = ic("stop"); } catch (x) { rec = null; }
};

function link(href, text){
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function inl(p, s0){
  s0.split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<>"]+)/).forEach(s => {
    if(!s) return;
    let n, m;
    if(s[0] === "`" && s.length > 2){ n = document.createElement("code"); n.textContent = s.slice(1, -1); }
    else if(s.startsWith("**") && s.length > 4){ n = document.createElement("b"); n.textContent = s.slice(2, -2); }
    else if((m = s.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/))){ n = link(m[2], m[1]); }
    else if(/^https?:\/\//.test(s)){ n = link(s, s); }
    else n = document.createTextNode(s);
    p.append(n);
  });
}
function fill(el, text){
  el.textContent = "";
  text.split("```").forEach((part, i) => {
    if(i % 2){
      const code = part.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
      const box = document.createElement("div"); box.className = "cb";
      const btn = document.createElement("button"); btn.type = "button"; btn.innerHTML = ic("copy", 16);
      btn.onclick = () => { try { navigator.clipboard.writeText(code); btn.innerHTML = ic("check", 16); setTimeout(() => btn.innerHTML = ic("copy", 16), 1500); } catch (e) {} };
      const pre = document.createElement("pre"); pre.textContent = code;
      box.append(btn, pre); el.append(box);
    } else if(part) inl(el, part);
  });
}
function bubble(role, text, tag){
  const el = document.createElement("div");
  el.className = "m " + (role === "user" ? "u" : "a");
  if(tag){ const g = document.createElement("span"); g.className = "tag"; g.textContent = tag; el.append(g); }
  const body = document.createElement("div"); fill(body, text); el.append(body);
  $("msgs").append(el);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return body;
}
function renderList(){
  const l = $("list"); l.textContent = "";
  chats.forEach(c => {
    const row = document.createElement("div"); row.className = "it" + (c.id === cid ? " on" : "");
    const b = document.createElement("button"); b.className = "t"; b.type = "button"; b.textContent = c.title;
    b.onclick = () => { cid = c.id; renderAll(); $("side").classList.remove("open"); };
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.innerHTML = ic("x", 14);
    x.onclick = () => { chats = chats.filter(k => k.id !== c.id); if(cid === c.id) cid = chats[0] ? chats[0].id : null; save(); renderAll(); };
    row.append(b, x); l.append(row);
  });
}
function renderMsgs(){
  const m = $("msgs"); m.textContent = "";
  const c = chat();
  if(!c || !c.msgs.length){
    const d = document.createElement("div"); d.className = "empty";
    d.innerHTML = LOGO + "<b>Lumia Ai</b>";
    d.append(t(3)); m.append(d); return;
  }
  c.msgs.forEach(x => bubble(x.role, x.content, x.role === "assistant" ? x.model : null));
}
function renderAll(){ renderList(); renderMsgs(); refresh(); }
$("new").onclick = () => { cid = null; renderAll(); $("side").classList.remove("open"); $("in").focus(); };
$("menu").onclick = () => $("side").classList.toggle("open");

function memory(){
  if(!memOn) return "";
  return chats.filter(c => c.id !== cid).slice(0, 6).map(c => {
    const q = c.msgs.filter(m => m.role === "user").slice(-1)[0];
    return "- " + c.title + (q ? ": " + q.content.slice(0, 80) : "");
  }).join("\n");
}
async function ask(model, msgs, apiText, P, V, B, nf, dv){
  const m = msgs.map(({role, content}) => ({role, content}));
  m[m.length - 1].content = apiText;
  const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({did, lang, model, dive: dv, memory: memory(), images: P, nfiles: nf,
      videos: V.map(v => ({mime: v.mime, data: v.data, frames: v.frames})),
      files: B.map(b => ({name: b.name, mime: b.mime, data: b.data})), messages: m})});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw {code: r.status, data: d};
  return d;
}
async function genImage(text){
  imgMode = false; renderAtt();
  busy = true; $("go").disabled = true; $("in").value = ""; $("in").style.height = "auto";
  let c = chat();
  if(!c){ c = {id: String(Date.now()), title: text.slice(0, 32), msgs: []}; chats.unshift(c); cid = c.id; }
  c.msgs.push({role: "user", content: text}); save(); renderAll();
  const el = document.createElement("div"); el.className = "m a";
  const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = "Lumia Art";
  const fr = document.createElement("div"); fr.className = "gen";
  const cap = document.createElement("span"); cap.textContent = t(24); fr.append(cap);
  el.append(tg, fr); $("msgs").append(el); $("msgs").scrollTop = $("msgs").scrollHeight;
  let d = {};
  try{
    const r = await fetch("/api/image", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({did, lang, prompt: text})});
    d = await r.json().catch(() => ({}));
  }catch(e){}
  const finish = (msg, icon) => {
    fr.remove(); el.append(notice(msg, icon));
    c.msgs.push({role: "assistant", content: msg, model: "Lumia Art"}); save();
  };
  if(d.image){
    fr.remove();
    const im = document.createElement("img"); im.className = "gimg"; im.alt = text; im.src = d.image;
    const a = document.createElement("a"); a.className = "dl"; a.href = d.image; a.download = "lumia-image." + (d.image.startsWith("data:image/png") ? "png" : "jpg"); a.innerHTML = ic("down", 16);
    const wrap = document.createElement("div"); wrap.append(im, document.createElement("br"), a); el.append(wrap);
    if(d.down) el.append(notice(t(32), "alert"));
    c.msgs.push({role: "assistant", content: t(29), model: "Lumia Art"}); save();
    toast(t(25, hhmm(d.resetAt), d.left), "clock");
  } else if(d.imgLimit){
    el.remove(); c.msgs.pop(); save(); renderAll(); $("in").value = text;
    toast(t(26, hhmm(d.resetAt)), "clock");
  } else if(d.refuse) finish(t(27), "alert");
  else finish(t(28), "alert");
  busy = false; refresh(); $("msgs").scrollTop = $("msgs").scrollHeight; $("in").focus();
}
async function send(){
  const text = $("in").value.trim();
  if(!text || busy) return;
  const hasAtt = pics.length + vids.length + docs.length + bins.length > 0;
  if(imgMode || (!hasAtt && IMG_RE.test(text))) return genImage(text);
  if(left() <= 0){ refresh(); return; }
  const nf = docs.length + bins.length, media = pics.length + vids.length + nf > 0;
  const need = pics.length * 20 + vids.length * 25 + nf * 30;
  if(need > srv.cLeft){ note(t(19, hhmm(srv.cReset)), "clock"); return; }
  if(rec) rec.stop();
  const P = pics, V = vids, D = docs, B = bins, dv = dive;
  const shown = text + (P.length ? "\n" + t(12) + " × " + P.length : "") + (V.length ? "\n" + t(22) + " × " + V.length : "") + D.concat(B).map(f => "\n" + t(13) + ": " + f.name).join("");
  const apiText = text + D.map(f => "\n\n[" + f.name + "]\n" + f.text).join("");
  pics = []; vids = []; docs = []; bins = []; renderAtt();
  const lt = light(), tag = NAMES[cur] + (lt ? " · lite" : "") + (dv ? " · dive" : "");
  busy = true; $("go").disabled = true; $("in").value = ""; $("in").style.height = "auto";
  let c = chat();
  if(!c){ c = {id: String(Date.now()), title: text.slice(0, 32), msgs: []}; chats.unshift(c); cid = c.id; }
  c.msgs.push({role: "user", content: shown}); save(); renderAll();
  const body = bubble("assistant", t(media ? 18 : 10), tag);
  try{
    const d = await ask(cur, c.msgs, apiText, P, V, B, nf, dv);
    c.msgs.push({role: "assistant", content: d.text, model: tag}); save();
    setSrv(d);
    fill(body, d.text);
  }catch(e){
    c.msgs.pop(); save();
    const dd = (e && e.data) || {};
    if(dd.limit || dd.credits){
      if(dd.left !== undefined) setSrv(dd);
      renderAll(); $("in").value = text; pics = P; vids = V; docs = D; bins = B; renderAtt();
      if(dd.credits) note(t(19, hhmm(dd.cReset)), "clock");
    } else { body.textContent = ""; body.append(notice(dd.media ? t(15) : t(11), "alert")); }
  }
  busy = false; refresh(); $("in").focus();
}
$("go").onclick = send;
$("in").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && innerWidth > 760){ e.preventDefault(); send(); } });
$("in").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px"; });
window.addEventListener("focus", loadUsage);
$("lsel").value = lang || "ru";
setModel(cur);
renderList();
ui();
loadUsage();
if(!lang) $("lov").classList.add("show");
</script>
