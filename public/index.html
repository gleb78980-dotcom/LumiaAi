<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumia Ai</title>
<style>
:root{--bg:#fff;--sf:#f4f4f5;--sd:#f9f9fa;--tx:#202123;--mu:#6e6e80;--bd:#e5e5e8;--ac:#10a37f;--code:#f4f4f5;--ub:#ececf1}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--sf:#2f2f2f;--sd:#171717;--tx:#ececec;--mu:#9b9b9b;--bd:#3a3a3a;--ac:#19c37d;--code:#171717;--ub:#2f2f2f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac);word-break:break-all}
.side{width:260px;background:var(--sd);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 6px 8px}
.brand svg{width:28px;height:28px}
#new{border:1px solid var(--bd);background:none;padding:10px 12px;border-radius:12px;text-align:left;font-weight:600}
#new:hover,.it:hover,#set:hover{background:var(--sf)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:10px}
.it.on{background:var(--sf)}
.it .t{flex:1;text-align:left;border:0;background:none;padding:9px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px}
.it .x{border:0;background:none;color:var(--mu);padding:6px 10px}
#set{border:0;background:none;padding:10px;border-radius:10px;text-align:left}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#menu{display:none;border:0;background:none;font-size:20px;padding:4px 8px}
.sw{display:flex;background:var(--sf);border-radius:12px;padding:3px}
.sw button{border:0;background:none;color:var(--mu);font-size:14px;font-weight:600;padding:6px 14px;border-radius:9px}
.sw button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#mh{padding:0 14px 6px;font-size:13px;color:var(--mu)}
#chip{margin-left:auto;border:0;background:var(--sf);border-radius:14px;padding:5px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#chip i{width:10px;height:10px;border-radius:50%;background:#22c55e}
#lite{display:none;margin:0 12px;padding:8px 12px;border-radius:12px;background:var(--sf);font-size:14px;color:var(--mu);align-items:center;gap:8px}
#lite.show{display:flex}
#lite span{flex:1}
#lite button{border:0;background:none;font-size:16px;color:var(--mu)}
#msgs{flex:1;overflow-y:auto;padding:12px;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{overflow-wrap:anywhere;white-space:pre-wrap}
.u{align-self:flex-end;max-width:85%;background:var(--ub);padding:8px 16px;border-radius:20px}
.a{align-self:stretch}
.tag{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:2px}
code{background:var(--code);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,Consolas,monospace}
.cb{margin:10px 0;background:var(--code);border-radius:12px;overflow:hidden;white-space:normal}
.cb button{display:block;margin:6px 8px 0 auto;border:0;background:none;color:var(--mu);font-size:12px}
.cb pre{margin:0;padding:6px 14px 14px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.empty{margin:auto;text-align:center;color:var(--mu)}
.empty svg{width:76px;height:76px;margin-bottom:10px}
.empty b{display:block;font-size:30px;color:var(--tx);margin-bottom:4px}
.foot{position:relative;width:100%;max-width:760px;margin:0 auto;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#limit{display:none;margin-bottom:8px;padding:9px 14px;border-radius:12px;background:var(--sf);font-size:14px}
#limit.show{display:block}
#att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#att:empty{display:none}
.ch{position:relative;background:var(--sf);border-radius:12px;font-size:13px;padding:6px 28px 6px 10px;max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch.p{padding:0;width:56px;height:56px}
.ch img{width:56px;height:56px;object-fit:cover;display:block;border-radius:12px}
.ch button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:18px;padding:0}
.bar{display:flex;align-items:flex-end;gap:4px;background:var(--sf);border-radius:26px;padding:8px}
#plus,#mic{border:0;background:none;font-size:20px;width:36px;height:36px;flex-shrink:0;color:var(--mu)}
#mic.on{color:#ef4444}
#pm{display:none;position:absolute;left:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:5}
#pm button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;border-radius:10px;white-space:nowrap}
#pm button:hover{background:var(--sf)}
textarea{flex:1;resize:none;max-height:150px;border:0;background:none;color:var(--tx);padding:8px 4px;font:inherit;outline:none}
#go{border:0;background:var(--tx);color:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;flex-shrink:0}
#go:disabled{opacity:.3}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.card{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.card h2{margin:0 0 14px;font-size:18px}
.row{margin:12px 0}
.pb{height:10px;background:var(--sf);border-radius:5px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:#22c55e;transition:width .3s,background .3s}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg input{width:20px;height:20px}
.small{font-size:13px;color:var(--mu)}
#lsel{background:var(--sf);border:0;border-radius:10px;padding:8px 10px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg button{padding:11px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
#close{margin-top:10px;width:100%;border:0;background:var(--tx);color:var(--bg);padding:10px;border-radius:12px;font-weight:600}
@media(max-width:760px){
.side{position:fixed;z-index:10;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
#menu{display:block}}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><span id="blogo"></span>Lumia Ai</div>
  <button id="new" type="button"><b>＋</b> <span data-i="0"></span></button>
  <div id="list"></div>
  <button id="set" type="button">⚙ <span data-i="1"></span></button>
</aside>
<div class="main">
  <header>
    <button id="menu" type="button">☰</button>
    <div class="sw">
      <button id="b-deep" class="on" type="button">Deep 1</button>
      <button id="b-heroes" type="button">Heroes 1</button>
    </div>
    <button id="chip" type="button"><i></i><span>100%</span></button>
  </header>
  <div id="mh"></div>
  <div id="lite"><span data-i="4"></span><button id="lx" type="button">✕</button></div>
  <div id="msgs"></div>
  <div class="foot">
    <div id="limit"></div>
    <div id="att"></div>
    <div id="pm">
      <button id="pp" type="button"></button>
      <button id="pf" type="button"></button>
    </div>
    <div class="bar">
      <button id="plus" type="button">＋</button>
      <textarea id="in" rows="1"></textarea>
      <button id="mic" type="button">🎤</button>
      <button id="go" type="button">↑</button>
    </div>
    <input type="file" id="fi" accept="image/*" multiple hidden>
    <input type="file" id="ff" multiple hidden accept=".txt,.md,.csv,.json,.html,.css,.js,.ts,.py,.java,.c,.cpp,.cs,.go,.rs,.php,.rb,.sql,.xml,.yml,.yaml,.log,.ini,.sh,text/*">
  </div>
</div>
<div class="ov" id="ov"><div class="card">
  <h2 data-i="1"></h2>
  <div class="row"><div class="tg"><b id="pct">100%</b><span class="small" id="rst"></span></div><div class="pb"><i id="bar"></i></div>
    <div class="small" style="margin-top:6px"><span data-i="6"></span> · Heroes 1 — 4% (2%) · Deep 1 — 6% (3%)</div></div>
  <div class="row tg"><span data-i="8"></span><input type="checkbox" id="mem"></div>
  <div class="row tg"><span>🌐</span><select id="lsel"></select></div>
  <button id="close" type="button" data-i="9"></button>
</div></div>
<div class="ov" id="lov"><div class="card">
  <h2>🌐 Language</h2>
  <div class="lg" id="lg"></div>
</div></div>

hi:["Heroes 1: तेज़ कामों के लिए","Deep 1: अधिक जटिल कामों के लिए"],
th:["Heroes 1: สำหรับงานเร็ว","Deep 1: สำหรับงานที่ซับซ้อนกว่า"]
};
const LOGO = '<svg viewBox="0 0 64 64"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19c37d"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg1)"/><path d="M32 11c1.7 10.5 8.5 17.3 19 19-10.5 1.7-17.3 8.5-19 19-1.7-10.5-8.5-17.3-19-19 10.5-1.7 17.3-8.5 19-19z" fill="#fff"/><circle cx="48" cy="16" r="3" fill="#fff" opacity=".8"/></svg>';
const $ = id => document.getElementById(id);
let chats = [], cid = null, cur = "deep", busy = false, memOn = true, liteHidden = false;
let srv = {left: 100, resetAt: 0}, did = "", lang = "";
let pics = [], docs = [], rec = null;
try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); cur = localStorage.getItem(MK) || "deep"; memOn = localStorage.getItem(PK) !== "0"; did = localStorage.getItem("lumia_did") || ""; lang = localStorage.getItem(LK) || ""; } catch (e) {}
if (!T[lang]) lang = "";
if (!did){
  did = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2) + "0000000000";
  try { localStorage.setItem("lumia_did", did); } catch (e) {}
}
if (!NAMES[cur]) cur = "deep";
if (chats.length) cid = chats[0].id;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 50))); } catch (e) {} };
const chat = () => chats.find(c => c.id === cid);
const t = (i, v) => { const s = (T[lang] || T.en)[i]; return v === undefined ? s : s.replace("{t}", v); };

const left = () => srv.left;
const light = () => srv.left > 0 && srv.left < 30;
const hhmm = x => { const d = new Date(x), l = lang || "ru"; return d.toLocaleTimeString(l, {hour: "2-digit", minute: "2-digit"}) + ", " + d.toLocaleDateString(l, {day: "numeric", month: "long"}); };
const color = l => l >= 70 ? "#22c55e" : l >= 30 ? "#eab308" : "#ef4444";
function note(s){ $("limit").textContent = s; $("limit").classList.add("show"); setTimeout(refresh, 3500); }

function refresh(){
  const l = left(), col = color(l);
  $("mh").textContent = (H[lang] || H.en)[cur === "deep" ? 1 : 0];
  $("lite").classList.toggle("show", light() && !liteHidden);
  const out = l <= 0;
  $("limit").classList.toggle("show", out);
  if(out) $("limit").textContent = t(5, hhmm(srv.resetAt));
  $("go").disabled = busy || out;
  $("pct").textContent = l + "%";
  $("pct").style.color = col;
  $("bar").style.width = l + "%";
  $("bar").style.background = col;
  $("chip").firstChild.style.background = col;
  $("chip").lastChild.textContent = l + "%";
  $("rst").textContent = srv.resetAt ? t(7, hhmm(srv.resetAt)) : "";
}
function ui(){
  document.documentElement.lang = lang || "ru";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(+e.dataset.i));
  $("in").placeholder = t(2);
  $("pp").textContent = "📷 " + t(12);
  $("pf").textContent = "📎 " + t(13);
  refresh(); renderMsgs();
}
function setLang(c){
  lang = c;
  try { localStorage.setItem(LK, c); } catch (e) {}
  $("lov").classList.remove("show"); $("lsel").value = c;
  ui();
}
async function loadUsage(){
  try{
    const r = await fetch("/api/usage", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({did})});
    const d = await r.json();
    if(r.ok){ srv = {left: d.left, resetAt: d.resetAt}; refresh(); }
  }catch(e){}
}
function setModel(k){
  cur = k;
  try { localStorage.setItem(MK, k); } catch (e) {}
  $("b-deep").classList.toggle("on", k === "deep");
  $("b-heroes").classList.toggle("on", k === "heroes");
  refresh();
}
const openSet = () => { $("mem").checked = memOn; loadUsage(); refresh(); $("ov").classList.add("show"); };
$("b-deep").onclick = () => setModel("deep");
$("b-heroes").onclick = () => setModel("heroes");
$("lx").onclick = () => { liteHidden = true; refresh(); };
$("set").onclick = openSet;
$("chip").onclick = openSet;
$("close").onclick = () => $("ov").classList.remove("show");
$("mem").onchange = e => { memOn = e.target.checked; try { localStorage.setItem(PK, memOn ? "1" : "0"); } catch (x) {} };
LANGS.forEach(([c, n]) => {
  const o = document.createElement("option"); o.value = c; o.textContent = n; $("lsel").append(o);
  const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.onclick = () => setLang(c); $("lg").append(b);
});
$("lsel").onchange = e => setLang(e.target.value);
$("blogo").innerHTML = LOGO;

function shrink(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 896 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .8));
      };
      im.onerror = () => res(null);
      im.src = r.result;
    };
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });
}
function renderAtt(){
  const a = $("att"); a.textContent = "";
  const add = (d, arr, i) => {
    const x = document.createElement("button"); x.type = "button"; x.textContent = "✕";
    x.onclick = () => { arr.splice(i, 1); renderAtt(); };
    d.append(x); a.append(d);
  };
  pics.forEach((u, i) => { const d = document.createElement("div"); d.className = "ch p"; const im = document.createElement("img"); im.src = u; d.append(im); add(d, pics, i); });
  docs.forEach((f, i) => { const d = document.createElement("div"); d.className = "ch"; d.append(document.createTextNode("📎 " + f.name)); add(d, docs, i); });
}
$("plus").onclick = () => { $("pm").style.display = $("pm").style.display === "block" ? "none" : "block"; };
$("pp").onclick = () => { $("pm").style.display = "none"; $("fi").click(); };
$("pf").onclick = () => { $("pm").style.display = "none"; $("ff").click(); };
document.addEventListener("click", e => { if(!e.target.closest("#pm,#plus")) $("pm").style.display = "none"; });
$("fi").onchange = async e => {
  for(const f of e.target.files){
    if(pics.length >= 5){ note("📷 ≤ 5"); break; }
    const u = await shrink(f); if(u) pics.push(u);
  }
  e.target.value = ""; renderAtt();
};
$("ff").onchange = async e => {
  for(const f of e.target.files){
    if(docs.length >= 3){ note("📎 ≤ 3"); break; }
    if(f.size > 2e6){ note("📎 ≤ 2 MB"); continue; }
    if(/\.(pdf|docx?|xlsx?|pptx?|zip|rar|7z|png|jpe?g|gif|webp|exe|apk)$/i.test(f.name)){ note("📎 txt · md · csv · json · code"); continue; }
    let txt = ""; try { txt = await f.text(); } catch (x) {}
    if(!txt || txt.indexOf("\u0000") >= 0){ note("📎 txt · md · csv · json · code"); continue; }
    docs.push({name: f.name, text: txt.slice(0, 4000)});
  }
  e.target.value = ""; renderAtt();
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if(!SR){ note(t(14)); return; }
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = RL[lang] || "ru-RU"; rec.interimResults = true; rec.continuous = true;
  const base = $("in").value ? $("in").value + " " : "";
  rec.onresult = e => {
    let s = ""; for(let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
    $("in").value = base + s; $("in").dispatchEvent(new Event("input"));
  };
  rec.onend = () => { rec = null; $("mic").classList.remove("on"); $("mic").textContent = "🎤"; };
  rec.onerror = () => {};
  try { rec.start(); $("mic").classList.add("on"); $("mic").textContent = "⏹"; } catch (x) { rec = null; }
};

function link(href, text){
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function inl(p, s0){
  s0.split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<>"]+)/).forEach(s => {
    if(!s) return;
    let n, m;
    if(s[0] === "`" && s.length > 2){ n = document.createElement("code"); n.textContent = s.slice(1, -1); }
    else if(s.startsWith("**") && s.length > 4){ n = document.createElement("b"); n.textContent = s.slice(2, -2); }
    else if((m = s.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/))){ n = link(m[2], m[1]); }
    else if(/^https?:\/\//.test(s)){ n = link(s, s); }
    else n = document.createTextNode(s);
    p.append(n);
  });
}
function fill(el, text){
  el.textContent = "";
  text.split("```").forEach((part, i) => {
    if(i % 2){
      const code = part.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
      const box = document.createElement("div"); box.className = "cb";
      const btn = document.createElement("button"); btn.textContent = "⧉"; btn.type = "button";
      btn.onclick = () => { try { navigator.clipboard.writeText(code); btn.textContent = "✓"; setTimeout(() => btn.textContent = "⧉", 1500); } catch (e) {} };
      const pre = document.createElement("pre"); pre.textContent = code;
      box.append(btn, pre); el.append(box);
    } else if(part) inl(el, part);
  });
}
function bubble(role, text, tag){
  const el = document.createElement("div");
  el.className = "m " + (role === "user" ? "u" : "a");
  if(tag){ const g = document.createElement("span"); g.className = "tag"; g.textContent = tag; el.append(g); }
  const body = document.createElement("div"); fill(body, text); el.append(body);
  $("msgs").append(el);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return body;
}
function renderList(){
  const l = $("list"); l.textContent = "";
  chats.forEach(c => {
    const row = document.createElement("div"); row.className = "it" + (c.id === cid ? " on" : "");
    const b = document.createElement("button"); b.className = "t"; b.type = "button"; b.textContent = c.title;
    b.onclick = () => { cid = c.id; renderAll(); $("side").classList.remove("open"); };
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "✕";
    x.onclick = () => { chats = chats.filter(k => k.id !== c.id); if(cid === c.id) cid = chats[0] ? chats[0].id : null; save(); renderAll(); };
    row.append(b, x); l.append(row);
  });
}
function renderMsgs(){
  const m = $("msgs"); m.textContent = "";
  const c = chat();
  if(!c || !c.msgs.length){
    const d = document.createElement("div"); d.className = "empty";
    d.innerHTML = LOGO + "<b>Lumia Ai</b>";
    d.append(t(3)); m.append(d); return;
  }
  c.msgs.forEach(x => bubble(x.role, x.content, x.role === "assistant" ? x.model : null));
}
function renderAll(){ renderList(); renderMsgs(); refresh(); }
$("new").onclick = () => { cid = null; renderAll(); $("side").classList.remove("open"); $("in").focus(); };
$("menu").onclick = () => $("side").classList.toggle("open");

function memory(){
  if(!memOn) return "";
  return chats.filter(c => c.id !== cid).slice(0, 6).map(c => {
    const q = c.msgs.filter(m => m.role === "user").slice(-1)[0];
    return "- " + c.title + (q ? ": " + q.content.slice(0, 80) : "");
  }).join("\n");
}
async function ask(model, msgs, apiText, imgs){
  const m = msgs.map(({role, content}) => ({role, content}));
  m[m.length - 1].content = apiText;
  const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({did, lang, model, memory: memory(), images: imgs, messages: m})});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw {code: r.status, data: d};
  return d;
}
async function send(){
  const text = $("in").value.trim();
  if(!text || busy || left() <= 0) return;
  if(rec) rec.stop();
  const imgs = pics.slice(), fl = docs.slice();
  const shown = text + (imgs.length ? "\n📷 × " + imgs.length : "") + fl.map(f => "\n📎 " + f.name).join("");
  const apiText = text + fl.map(f => "\n\n[" + f.name + "]\n" + f.text).join("");
  pics = []; docs = []; renderAtt();
  const lt = light(), tag = NAMES[cur] + (lt ? " ⚡" : "");
  busy = true; $("go").disabled = true; $("in").value = ""; $("in").style.height = "auto";
  let c = chat();
  if(!c){ c = {id: String(Date.now()), title: text.slice(0, 32), msgs: []}; chats.unshift(c); cid = c.id; }
  c.msgs.push({role: "user", content: shown}); save(); renderAll();
  const body = bubble("assistant", t(10), tag);
  try{
    const d = await ask(cur, c.msgs, apiText, imgs);
    c.msgs.push({role: "assistant", content: d.text, model: tag}); save();
    srv = {left: d.left, resetAt: d.resetAt};
    fill(body, d.text);
  }catch(e){
    c.msgs.pop(); save();
    if(e && e.data && e.data.limit){ srv = {left: 0, resetAt: e.data.resetAt}; renderAll(); $("in").value = text; }
    else fill(body, e && e.data && e.data.photo ? t(15) : t(11));
  }
  busy = false; refresh(); $("in").focus();
}
$("go").onclick = send;
$("in").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && innerWidth > 760){ e.preventDefault(); send(); } });
$("in").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px"; });
window.addEventListener("focus", loadUsage);
$("lsel").value = lang || "ru";
setModel(cur);
renderList();
ui();
loadUsage();
if(!lang) $("lov").classList.add("show");
</script>
</body>
</html>
