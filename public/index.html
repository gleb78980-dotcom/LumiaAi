<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumia Ai</title>
<style>
:root{--bg:#f6f5fb;--sf:#fff;--tx:#1b1a24;--mu:#6b6980;--ac:#6c5ce7;--ac2:#00a99a;--bd:#e3e1ee;--code:#efedf8}
@media (prefers-color-scheme:dark){:root{--bg:#13121a;--sf:#1d1c27;--tx:#ecebf5;--mu:#9a98b0;--ac:#8b7dff;--ac2:#2fd3c3;--bd:#2c2a3a;--code:#14131c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac);word-break:break-all}
.u a{color:#fff}
.side{width:260px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0}
.side h1{margin:4px 6px 8px;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#new{border:0;background:var(--ac);color:#fff;font-weight:600;padding:10px;border-radius:12px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:10px}
.it.on{background:var(--bg)}
.it button.t{flex:1;text-align:left;border:0;background:none;padding:9px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it button.x{border:0;background:none;color:var(--mu);padding:6px 10px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--bd)}
#menu{display:none;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:6px 10px}
.sw{display:flex;margin-left:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:3px}
.sw button{border:0;background:none;color:var(--mu);font-size:14px;font-weight:600;padding:6px 12px;border-radius:9px}
.sw button.on{background:var(--ac);color:#fff}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:780px;margin:0 auto}
.m{max-width:90%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:5px}
.a{align-self:flex-start;background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:5px}
.tag{display:block;font-size:11px;font-weight:700;color:var(--ac);margin-bottom:2px}
code{background:var(--code);padding:1px 5px;border-radius:5px;font:13px ui-monospace,Menlo,Consolas,monospace}
.cb{margin:8px 0;background:var(--code);border-radius:12px;overflow:hidden;white-space:normal}
.cb button{display:block;margin:6px 6px 0 auto;border:1px solid var(--bd);background:var(--sf);border-radius:8px;font-size:12px;padding:3px 9px}
.cb pre{margin:0;padding:8px 12px 12px;overflow-x:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.empty{margin:auto;text-align:center;color:var(--mu);padding:20px}
.empty b{display:block;font-size:26px;color:var(--tx);margin-bottom:6px}
.bar{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);width:100%;max-width:780px;margin:0 auto}
textarea{flex:1;resize:none;max-height:150px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:16px;padding:10px 14px;font:inherit}
textarea:focus{outline:2px solid var(--ac)}
#go{border:0;background:var(--ac);color:#fff;font-weight:600;padding:0 18px;border-radius:16px}
#go:disabled{opacity:.5}
@media(max-width:760px){
.side{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
#menu{display:block}}
</style>
</head>
<body>
<aside class="side" id="side">
  <h1>Lumia Ai</h1>
  <button id="new" type="button">+ Новый чат</button>
  <div id="list"></div>
</aside>
<div class="main">
  <header>
    <button id="menu" type="button">☰</button>
    <div class="sw">
      <button id="b-deep" class="on" type="button">Deep 1</button>
      <button id="b-heroes" type="button">Heroes 1</button>
    </div>
  </header>
  <div id="msgs"></div>
  <div class="bar">
    <textarea id="in" rows="1" placeholder="Напиши, что нужно…"></textarea>
    <button id="go" type="button">Отправить</button>
  </div>
</div>
<script>
const KEY = "lumia_chats_v1", MK = "lumia_model";
const NAMES = {deep: "Deep 1", heroes: "Heroes 1"};
const $ = id => document.getElementById(id);
let chats = [], cid = null, cur = "deep", busy = false;
try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); cur = localStorage.getItem(MK) || "deep"; } catch (e) {}
if (!NAMES[cur]) cur = "deep";
if (chats.length) cid = chats[0].id;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 50))); } catch (e) {} };
const chat = () => chats.find(c => c.id === cid);

function setModel(k){
  cur = k;
  try { localStorage.setItem(MK, k); } catch (e) {}
  $("b-deep").classList.toggle("on", k === "deep");
  $("b-heroes").classList.toggle("on", k === "heroes");
}
$("b-deep").onclick = () => setModel("deep");
$("b-heroes").onclick = () => setModel("heroes");
setModel(cur);

function link(href, text){
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function inl(p, t){
  t.split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<>"]+)/).forEach(s => {
    if(!s) return;
    let n, m;
    if(s[0] === "`" && s.length > 2){ n = document.createElement("code"); n.textContent = s.slice(1, -1); }
    else if(s.startsWith("**") && s.length > 4){ n = document.createElement("b"); n.textContent = s.slice(2, -2); }
    else if((m = s.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/))){ n = link(m[2], m[1]); }
    else if(/^https?:\/\//.test(s)){ n = link(s, s); }
    else n = document.createTextNode(s);
    p.append(n);
  });
}
function fill(el, text){
  el.textContent = "";
  text.split("```").forEach((part, i) => {
    if(i % 2){
      const code = part.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
      const box = document.createElement("div"); box.className = "cb";
      const btn = document.createElement("button"); btn.textContent = "Копировать"; btn.type = "button";
      btn.onclick = () => { try { navigator.clipboard.writeText(code); btn.textContent = "Скопировано"; setTimeout(() => btn.textContent = "Копировать", 1500); } catch (e) {} };
      const pre = document.createElement("pre"); pre.textContent = code;
      box.append(btn, pre); el.append(box);
    } else if(part) inl(el, part);
  });
}
function bubble(role, text, tag){
  const el = document.createElement("div");
  el.className = "m " + (role === "user" ? "u" : "a");
  if(tag){ const t = document.createElement("span"); t.className = "tag"; t.textContent = tag; el.append(t); }
  const body = document.createElement("div"); fill(body, text); el.append(body);
  $("msgs").append(el);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return body;
}
function renderList(){
  const l = $("list"); l.textContent = "";
  chats.forEach(c => {
    const row = document.createElement("div"); row.className = "it" + (c.id === cid ? " on" : "");
    const t = document.createElement("button"); t.className = "t"; t.type = "button"; t.textContent = c.title;
    t.onclick = () => { cid = c.id; renderAll(); $("side").classList.remove("open"); };
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "✕";
    x.onclick = () => { chats = chats.filter(k => k.id !== c.id); if(cid === c.id) cid = chats[0] ? chats[0].id : null; save(); renderAll(); };
    row.append(t, x); l.append(row);
  });
}
function renderMsgs(){
  const m = $("msgs"); m.textContent = "";
  const c = chat();
  if(!c || !c.msgs.length){
    const d = document.createElement("div"); d.className = "empty";
    const b = document.createElement("b"); b.textContent = "Lumia Ai";
    d.append(b, "Выбери модель сверху и задай вопрос"); m.append(d); return;
  }
  c.msgs.forEach(x => bubble(x.role, x.content, x.role === "assistant" ? x.model : null));
}
function renderAll(){ renderList(); renderMsgs(); }
$("new").onclick = () => { cid = null; renderAll(); $("side").classList.remove("open"); $("in").focus(); };
$("menu").onclick = () => $("side").classList.toggle("open");

async function ask(model, msgs){
  const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({model, messages: msgs.map(({role, content}) => ({role, content}))})});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw {code: r.status, message: d.error};
  return d.text;
}
async function send(){
  const text = $("in").value.trim();
  if(!text || busy) return;
  busy = true; $("go").disabled = true; $("in").value = ""; $("in").style.height = "auto";
  let c = chat();
  if(!c){ c = {id: String(Date.now()), title: text.slice(0, 32), msgs: []}; chats.unshift(c); cid = c.id; }
  c.msgs.push({role: "user", content: text}); save(); renderAll();
  const body = bubble("assistant", "Думаю…", NAMES[cur]);
  try{
    const out = await ask(cur, c.msgs);
    c.msgs.push({role: "assistant", content: out, model: NAMES[cur]}); save();
    fill(body, out);
  }catch(e){
    c.msgs.pop(); save();
    fill(body, e && e.code === 429 ? "Слишком много запросов, подожди немного." : "Не получилось ответить. Попробуй ещё раз.");
  }
  busy = false; $("go").disabled = false; $("in").focus();
}
$("go").onclick = send;
$("in").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && innerWidth > 760){ e.preventDefault(); send(); } });
$("in").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px"; });
renderAll();
</script>
</body>
</html>
